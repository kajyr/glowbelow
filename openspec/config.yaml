schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - For a change that adds or changes something the player sees, list the dev blog post under Impact
  tasks:
    - Every feature change (anything the player sees or plays differently) ends with a tracked "Dev blog" task group
    - The dev blog task writes `docs/itch/devlog/YYYY-MM-DD-<slug>.md` (title, short what's-new, a screenshot or two saved next to it, what's next), or adds a section to today's post if one already covers the same release
    - Pure refactors, tooling, fixes with no visible change and docs-only changes skip the dev blog

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
